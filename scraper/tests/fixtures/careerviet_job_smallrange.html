<html><head><script id="job-posting-schema" type="application/ld+json">{"@context":"http://schema.org","@type":"JobPosting","inLanguage":"vi","title":"Quote Engineer (Kỹ Sư Giá Thành)/ Estimator","description":"\n        <p>The Senior Estimator is responsible for developing accurate and detailed cost estimates for semiconductor inspection and metrology equipment projects. This role supports the quotation, sourcing, and planning processes for precision mechanical fabrication and tool assembly. The ideal candidate has strong Excel skills, solid understanding of machining and manufacturing cost structures, and the ability to work independently while reporting directly to top management.</p><p><strong>A. Estimation & Technical Analysis</strong></p><ul><li>Review, audit, and summarize customer specifications and technical requirements.</li><li>Conduct technical assessments and audits to gather and analyze the information necessary for accurate quotations.</li><li>Develop detailed cost estimates for mechanical parts, subassemblies, and complete systems based on engineering drawings, BOMs, and technical specifications.</li><li>Analyze RFQs from customers and suppliers to identify cost drivers and prepare competitive quotations.</li><li>Build, maintain cost models, and prepare “what-if” analyses for management review.</li><li>Perform design-for-manufacturability (DFM) reviews to ensure cost efficiency and manufacturability.</li></ul><p><strong>B. Coordination & Communication</strong></p><ul><li>Collaborate and coordinate with engineering, supply chain, and production teams to validate manufacturing methods, material selections, and assembly process assumptions.</li><li>Lead meetings and communications related to quotation and pricing discussions.</li><li>Provide pre- and post-sales technical support to internal teams.</li><li>Ensure on-time and accurate responses to all quotation and technical email inquiries.</li><li>Work closely with global teams (factory, sales, and purchasing) to resolve issues and provide coordinated support.</li><li>Collaborate with related departments to gather necessary information and optimize cost proposals, including design guidelines, costing methods, and material cost data.</li></ul><p><strong>C. Reporting & Continuous Improvement</strong></p><ul><li>Prepare summary reports and presentations for executive-level decision-making.</li><li>Support continuous improvement by identifying cost reduction opportunities and manufacturing efficiency enhancements.</li><li>Maintain cost databases and historical data for recurring and similar projects.</li><li>Ensure all cost estimates comply with company standards and customer expectations.</li><li>Perform additional duties as assigned by the reporting manager.</li></ul><p><strong>Benefits </strong></p><ul><li>Meal Allowance: Daily meal support provided.</li><li>Working Equipment: Necessary working equipment and tools will be provided.</li><li>On-the-job Training: Opportunity to gain practical experience.</li><li>Professional Working Environment: Opportunity to work in a professional and multinational environment.</li><li>Healthcare Insurance: Healthcare insurance premium is fully covered by the company in accordance with company policy.</li></ul>\n        <p>• Bachelor’s degree in Mechanical Engineering, Industrial Engineering, Business, or related field.</p><p>• 3–5 years of experience in cost estimation or manufacturing engineering, preferably within semiconductor equipment, precision machining, or contract manufacturing environments.</p><ul><li>Strong technical understanding of CNC machining, sheet metal fabrication, welding, and mechanical assembly processes.</li><li>Expert-level proficiency in Microsoft Excel, including complex formulas, pivot tables, data analysis, and macros.</li><li>Excellent analytical, numerical, and problem-solving skills.</li><li>Able to work independently and manage multiple RFQs or projects under tight deadlines.</li><li>Strong English c
