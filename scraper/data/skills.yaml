# Skill taxonomy for the skill extractor.
#
# - slug: stable id stored in the DB. Never rename a slug once data exists.
# - aliases: lowercase strings, matched on word boundaries (case-insensitive).
#
# Ambiguous words are deliberately NOT aliases: "go" (as in "go to market"),
# "r", "c" (would match inside "c++"), "express", "node", "rest", "ts", "js", "spark"
# only as "apache spark". Add an alias only after checking it on real postings.

skills:
  # Languages
  - slug: python
    name: Python
    category: language
    aliases: [python, python3]
  - slug: javascript
    name: JavaScript
    category: language
    aliases: [javascript]
